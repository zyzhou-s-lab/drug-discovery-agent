[project]
name = "dd-agent"
version = "0.0.2"
description = "Drug target-discovery agent harness (Phase A)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",          # M0/dummy + OpenTargets tool (stdlib) need only this
]

[project.optional-dependencies]
real = ["claude-agent-sdk", "anthropic"]   # M1+: Agent SDK worker + Messages API judge
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]   # M5: read API + SSE observer
dev = ["pytest", "pytest-asyncio", "httpx"]  # httpx: fastapi TestClient (endpoint tests)

[project.scripts]
dd-agent = "dd_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
