name: release-please

# 监听 master 上的 conventional commits，自动维护一个「Release PR」：
#   - 该 PR 里已写好 CHANGELOG.md 的新条目
#   - 并把 pyproject.toml 的版本号按 feat/fix 自动升级
# 合并该 PR 时，自动打 tag + 创建 GitHub Release。

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 配置见 release-please-config.json + .release-please-manifest.json
