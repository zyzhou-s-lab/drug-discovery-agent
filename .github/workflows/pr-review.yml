name: PR Review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-review:
    if: |
      github.event.pull_request.draft == false &&
      !endsWith(github.actor, '[bot]') &&
      !contains(github.event.pull_request.labels.*.name, 'bot-skip')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check existing bot review
        id: check_bot
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "*Drug Discovery Bot*";
            const currentHeadSha = context.payload.pull_request.head.sha;
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100
              }
            );
            const botReviews = reviews
              .filter(r => (r.body || "").includes(marker) && r.user?.type === "Bot")
              .sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));
            const hasReviewForCurrentHead = botReviews.some(r => r.commit_id === currentHeadSha);
            const latestBotReview = botReviews[0];
            const isFollowUp = Boolean(latestBotReview?.commit_id && latestBotReview.commit_id !== currentHeadSha);

            core.setOutput("current_head_sha", currentHeadSha);
            core.setOutput("has_review", hasReviewForCurrentHead ? "true" : "false");
            core.setOutput("is_follow_up", isFollowUp ? "true" : "false");
            core.setOutput("latest_review_id", latestBotReview ? String(latestBotReview.id) : "");
            core.setOutput("latest_review_commit", latestBotReview?.commit_id || "");

            if (hasReviewForCurrentHead) {
              core.info(`Review already exists for ${currentHeadSha}; skipping.`);
            } else if (isFollowUp) {
              core.info(`Latest bot review was for ${latestBotReview.commit_id}; running follow-up for ${currentHeadSha}.`);
            }

      - name: Checkout
        if: steps.check_bot.outputs.has_review != 'true'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Pre-fetch base and head refs
        if: steps.check_bot.outputs.has_review != 'true'
        run: |
          git fetch --no-tags origin \
            ${{ github.event.pull_request.base.ref }} \
            +refs/pull/${{ github.event.pull_request.number }}/head

      - name: Run review agent
        if: steps.check_bot.outputs.has_review != 'true'
        uses: anthropics/claude-code-base-action@v0.0.63
        env:
          # Point the agent at the Anthropic-compatible endpoint.
          ANTHROPIC_BASE_URL: ${{ vars.MIMO_BASE_URL || 'https://token-plan-cn.xiaomimimo.com/anthropic' }}
          # The endpoint exposes a single model; remap the agent's size aliases to it
          # so internal small-model calls don't hit a non-existent model.
          ANTHROPIC_DEFAULT_OPUS_MODEL: mimo-v2.5-pro
          ANTHROPIC_DEFAULT_SONNET_MODEL: mimo-v2.5-pro
          ANTHROPIC_DEFAULT_HAIKU_MODEL: mimo-v2.5-pro
          # Context for the agentic prompt to fetch on its own.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_HEAD_SHA: ${{ steps.check_bot.outputs.current_head_sha }}
          LATEST_BOT_REVIEW_ID: ${{ steps.check_bot.outputs.latest_review_id }}
          LATEST_BOT_REVIEW_COMMIT: ${{ steps.check_bot.outputs.latest_review_commit }}
          IS_FOLLOW_UP_REVIEW: ${{ steps.check_bot.outputs.is_follow_up }}
        with:
          anthropic_api_key: ${{ secrets.MIMO_API_KEY }}
          prompt_file: .github/prompts/pr-review.md
          model: mimo-v2.5-pro
          max_turns: "40"
          timeout_minutes: "10"
          # Write is allowed only so the agent can stage the review JSON payload in
          # /tmp before posting; the prompt forbids repo edits (matches upstream hapi,
          # which grants full sandbox access and relies on the prompt instruction).
          allowed_tools: "Bash,Read,Grep,Glob,Write"
