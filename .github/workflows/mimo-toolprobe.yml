name: MiMo tool_use probe

# One-off diagnostic: does the MiMo Anthropic-compatible endpoint return a
# protocol-compliant structured `tool_use` block, or just text with
# <tool_call> garbage? Trigger manually; delete after we have the answer.
on:
  workflow_dispatch:
  push:
    branches: [feat/agentic-pr-review]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Call MiMo with a tools definition
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_BASE_URL: ${{ vars.MIMO_BASE_URL || 'https://token-plan-cn.xiaomimimo.com/anthropic' }}
        run: |
          REQ=$(jq -n '{
            model: "mimo-v2.5-pro",
            max_tokens: 1024,
            tools: [
              {
                name: "get_weather",
                description: "Get the current weather for a given city.",
                input_schema: {
                  type: "object",
                  properties: { city: { type: "string", description: "City name" } },
                  required: ["city"]
                }
              }
            ],
            messages: [
              { role: "user", content: "What is the weather in Paris right now? You must use the get_weather tool to answer." }
            ]
          }')

          RESP=$(curl -s -X POST "${MIMO_BASE_URL}/v1/messages" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${MIMO_API_KEY}" \
            -H "anthropic-version: 2023-06-01" \
            -d "$REQ")

          echo "=================== RAW RESPONSE ==================="
          echo "$RESP" | jq . 2>/dev/null || echo "$RESP"

          echo
          echo "=================== VERDICT ==================="
          STOP=$(echo "$RESP" | jq -r '.stop_reason // "n/a"' 2>/dev/null)
          TYPES=$(echo "$RESP" | jq -r '[.content[].type] | join(",")' 2>/dev/null)
          HAS_TOOL_USE=$(echo "$RESP" | jq -r 'any(.content[]?; .type == "tool_use")' 2>/dev/null)
          TEXT=$(echo "$RESP" | jq -r '[.content[]? | select(.type=="text") | .text] | join("\n")' 2>/dev/null)

          echo "stop_reason      = $STOP"
          echo "content types    = $TYPES"
          echo "has tool_use blk = $HAS_TOOL_USE"

          if echo "$TEXT" | grep -qiE '<tool_call|<function|<parameter|tool_call>'; then
            echo "text contains pseudo-tool-call syntax = YES (garbage mode)"
          else
            echo "text contains pseudo-tool-call syntax = no"
          fi

          echo
          if [ "$HAS_TOOL_USE" = "true" ] && [ "$STOP" = "tool_use" ]; then
            echo ">>> PASS: MiMo emits a protocol-compliant structured tool_use block. Agentic (Claude Code) is viable."
          else
            echo ">>> FAIL: no structured tool_use block. Agentic via Claude Code will NOT work against MiMo."
          fi
