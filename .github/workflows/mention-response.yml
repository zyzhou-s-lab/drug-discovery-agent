name: Mention Response

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: mention-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  mention-response:
    # Only run when a human (not a bot) @-mentions the bot. The bot exclusion
    # prevents bot-to-bot loops (e.g. the review bot's comments re-triggering us).
    if: |
      contains(github.event.comment.body, '@zyzhou') &&
      !endsWith(github.event.comment.user.login, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Check user permissions and skip conditions
        id: check_skip
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "*Drug Discovery Bot*";
            const triggeringCommentId = context.payload.comment.id;
            const replyMarker = `<!-- reply-to:${triggeringCommentId} -->`;
            const allowedLogins = (process.env.BOT_LOGINS || "github-actions[bot]")
              .split(",").map(v => v.trim()).filter(Boolean);

            // Require the commenter to have write/admin access — prevents arbitrary
            // users summoning a bot that holds a write token + secrets.
            const commentAuthor = context.payload.comment.user.login;
            const { data: permissionData } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commentAuthor
            });
            const permission = permissionData.permission;
            const hasWriteAccess = ["admin", "write"].includes(permission);
            if (!hasWriteAccess) {
              core.setOutput("should_skip", "true");
              core.info(`User ${commentAuthor} has '${permission}' permission; write access required. Skipping.`);
              return;
            }

            const isIssueComment = context.eventName === "issue_comment";
            let targetNumber, labels, isPR;
            if (isIssueComment) {
              targetNumber = context.payload.issue.number;
              labels = context.payload.issue.labels || [];
              isPR = !!context.payload.issue.pull_request;
            } else {
              targetNumber = context.payload.pull_request.number;
              labels = context.payload.pull_request.labels || [];
              isPR = true;
            }

            const hasBotSkip = labels.some(l => l.name === "bot-skip");
            if (hasBotSkip) {
              core.setOutput("should_skip", "true");
              core.info("bot-skip label found; skipping.");
              return;
            }

            // Dedup: skip if we already replied to this exact comment.
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: targetNumber, per_page: 100 }
            );
            const hasReply = comments.some(comment => {
              const body = comment?.body || "";
              if (!body.includes(marker) || !body.includes(replyMarker)) return false;
              const user = comment.user;
              return user?.type === "Bot" && allowedLogins.includes(user.login);
            });
            if (hasReply) {
              core.setOutput("should_skip", "true");
              core.info(`Existing reply to comment ${triggeringCommentId} found; skipping.`);
              return;
            }

            core.setOutput("should_skip", "false");
            core.setOutput("triggering_comment_id", String(triggeringCommentId));
            core.setOutput("target_number", String(targetNumber));
            core.setOutput("event_type", isIssueComment ? "issue_comment" : "pr_review_comment");
            core.setOutput("is_pr", isPR ? "true" : "false");
        env:
          BOT_LOGINS: ${{ vars.BOT_LOGINS }}

      - name: Checkout
        if: steps.check_skip.outputs.should_skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fetch all branches
        if: steps.check_skip.outputs.should_skip != 'true'
        run: git fetch --all

      - name: Run mention agent
        if: steps.check_skip.outputs.should_skip != 'true'
        uses: anthropics/claude-code-base-action@v0.0.63
        env:
          ANTHROPIC_BASE_URL: ${{ vars.LLM_BASE_URL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.LLM_MODEL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.LLM_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.LLM_MODEL }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TRIGGERING_COMMENT_ID: ${{ steps.check_skip.outputs.triggering_comment_id }}
          TARGET_NUMBER: ${{ steps.check_skip.outputs.target_number }}
          EVENT_TYPE: ${{ steps.check_skip.outputs.event_type }}
          IS_PR: ${{ steps.check_skip.outputs.is_pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          anthropic_api_key: ${{ secrets.LLM_API_KEY }}
          prompt_file: .github/prompts/mention-response.md
          model: ${{ vars.LLM_MODEL }}
          max_turns: "40"
          timeout_minutes: "15"
          allowed_tools: "Bash,Read,Grep,Glob,Write"
